name: Photon tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fast:
    name: Unit, contracts, simulation, and fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x'}
      - uses: mlugg/setup-zig@v2
        with: {version: '0.16.0'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Frontier native dependencies
        run: sudo apt-get update && sudo apt-get install --yes libhiredis-dev librdkafka-dev
      - name: Install embedder test dependencies
        run: python -m venv .venv && .venv/bin/pip install -r embedder/requirements.txt
      - name: Fast gate
        run: make test-fast

  functional:
    name: Controlled-origin integration and acceptance
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x'}
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose topology
        run: docker compose --profile test config --quiet
      - name: Run service integration tests
        run: make test-integration
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-artifacts
          path: artifacts/
          if-no-files-found: ignore
