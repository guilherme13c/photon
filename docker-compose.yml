services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      # Keep the Kafka coordination state container-managed for the same
      # non-root ownership guarantee as Kafka's broker log volume.
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics must be provisioned with their intended partition count before
      # producers start; implicit one-partition creation serializes the crawler.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      # Docker manages ownership for this volume, so Kafka's non-root appuser
      # can write its log segments in isolated Compose and benchmark projects.
      - kafka_data:/var/lib/kafka/data

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      - kafka

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - --docker_only=true

  init-kafka:
    image: confluentinc/cp-kafka:7.3.2
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-ec' ]
    # Compose passes each command list item as one argument. Keeping the script
    # in a single item prevents `sh -c` from executing only its first word.
    command:
      - |
        until kafka-topics --bootstrap-server kafka:29092 --list > /dev/null 2>&1; do
          echo 'Waiting for Kafka to become reachable...'
          sleep 2
        done

        echo 'Creating Kafka topics'
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic fetched-pages --replication-factor 1 --partitions 3
        # Embedding is CPU-bound and stateless per URL. Match the frontier's
        # partition count so replicas can scale past three consumer lanes.
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic cleaned_documents --replication-factor 1 --partitions 12
        # `--create --if-not-exists` does not expand an existing development or
        # staging topic. Kafka rejects an --alter request for an already-sized
        # topic, so inspect before expanding rather than turning a successful
        # initialization into a failed Compose dependency.
        current_partitions="$(kafka-topics --bootstrap-server kafka:29092 --describe --topic cleaned_documents | sed -n 's/.*PartitionCount:[[:space:]]*\([0-9][0-9]*\).*/\1/p')"
        if [ "$$current_partitions" -lt 12 ]; then
          kafka-topics --bootstrap-server kafka:29092 --alter --topic cleaned_documents --partitions 12
        fi
        # Fetch work is keyed by host to preserve per-host ordering. Give that
        # key space enough partitions that independent hot hosts do not share
        # one serial consumer lane.
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic urls --replication-factor 1 --partitions 12
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic frontier-dlq --replication-factor 1 --partitions 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic fetcher-dlq --replication-factor 1 --partitions 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic extractor-dlq --replication-factor 1 --partitions 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic embedder-dlq --replication-factor 1 --partitions 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic object-cleanup --replication-factor 1 --partitions 12
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic dynamic-urls --replication-factor 1 --partitions 12
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic discovered-urls --replication-factor 1 --partitions 12

        echo 'Successfully created the following topics:'
        kafka-topics --bootstrap-server kafka:29092 --list

  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data

  init-minio:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb myminio/html-payloads || true;
      /usr/bin/mc anonymous set public myminio/html-payloads;
      exit 0;
      "

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.19.1}
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis

  frontier:
    build:
      context: ./frontier
    depends_on:
      redis:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379
      PORT: 8080
      FRONTIER_ROLE: manager
      KAFKA_INGEST_TOPIC: discovered-urls
      KAFKA_DYNAMIC_URLS_TOPIC: dynamic-urls
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Stateless consumers of the durable candidate stream. Scale this service
  # with `docker compose up --scale admission-worker=N`; Redis Lua remains the
  # atomic dedupe and per-host scheduling boundary across all replicas.
  admission-worker:
    build:
      context: ./frontier
    depends_on:
      redis:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379
      FRONTIER_ROLE: admission
      KAFKA_INGEST_TOPIC: discovered-urls
      KAFKA_GROUP_ID: admission-workers
      KAFKA_DLQ_TOPIC: frontier-dlq
    restart: unless-stopped
    deploy:
      replicas: ${PHOTON_ADMISSION_REPLICAS:-3}
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  extractor:
    build:
      context: ./extractor
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      init-minio:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:29092
      MINIO_ENDPOINT: http://minio:9000
      KAFKA_INGEST_TOPIC: ${EXTRACTOR_KAFKA_INGEST_TOPIC:-fetched-pages}
      KAFKA_DISCOVERED_URLS_TOPIC: ${EXTRACTOR_KAFKA_DISCOVERED_URLS_TOPIC:-discovered-urls}
      KAFKA_CLEANED_TOPIC: ${EXTRACTOR_KAFKA_CLEANED_TOPIC:-cleaned_documents}
      KAFKA_GROUP_ID: ${EXTRACTOR_KAFKA_GROUP_ID:-extractor-group}
      KAFKA_DLQ_TOPIC: ${EXTRACTOR_KAFKA_DLQ_TOPIC:-extractor-dlq}
      PROMETHEUS_PORT: ${EXTRACTOR_PROMETHEUS_PORT:-8001}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  embedder:
    build:
      context: ./embedder
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      init-minio:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:29092
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-photon_documents_hybrid}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      KAFKA_INPUT_TOPIC: ${EMBEDDER_KAFKA_INPUT_TOPIC:-cleaned_documents}
      KAFKA_GROUP_ID: ${EMBEDDER_KAFKA_GROUP_ID:-ray-embedder-workers}
      KAFKA_DLQ_TOPIC: ${EMBEDDER_KAFKA_DLQ_TOPIC:-embedder-dlq}
      KAFKA_CLEANUP_TOPIC: ${EMBEDDER_KAFKA_CLEANUP_TOPIC:-object-cleanup}
      EMBED_BATCH_SIZE: ${PHOTON_EMBED_BATCH_SIZE:-32}
      EMBED_BATCH_WAIT_MS: ${PHOTON_EMBED_BATCH_WAIT_MS:-25}
      EMBED_MAX_TEXT_CHARS: ${PHOTON_EMBED_MAX_TEXT_CHARS:-8192}
      PROMETHEUS_PORT: ${EMBEDDER_PROMETHEUS_PORT:-8000}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  search:
    build:
      context: ./search
    depends_on:
      qdrant:
        condition: service_started
    environment:
      SEARCH_LISTEN_ADDR: :8082
      MODEL_NAME: ${MODEL_NAME:-all-MiniLM-L6-v2}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-photon_documents_hybrid}
      SEARCH_VECTOR_DIMENSIONS: ${SEARCH_VECTOR_DIMENSIONS:-384}
    ports:
      - "${SEARCH_PORT:-8082}:8082"
    volumes:
      - search_model_cache:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  cleanup-worker:
    build:
      context: ./cleanup-worker
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      minio:
        condition: service_started
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: object-cleanup-workers
      KAFKA_CLEANUP_TOPIC: object-cleanup
      CLEANUP_BATCH_WAIT_MS: ${PHOTON_CLEANUP_BATCH_WAIT_MS:-100}
      # MinIO Client reads this named alias without writing credentials to disk.
      MC_HOST_photon: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@minio:9000
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M


  renderer:
    build:
      context: ./renderer
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      init-minio:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: ${RENDERER_KAFKA_TOPIC:-dynamic-urls}
      KAFKA_PRODUCER_TOPIC: ${RENDERER_KAFKA_PRODUCER_TOPIC:-fetched-pages}
      KAFKA_GROUP: ${RENDERER_KAFKA_GROUP:-renderer-group}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MAX_ROUTINES: ${PHOTON_MAX_ROUTINES:-10}
      RENDERER_BROWSER_CONCURRENCY: ${PHOTON_RENDERER_BROWSER_CONCURRENCY:-${PHOTON_MAX_ROUTINES:-10}}
      FRONTIER_URL: http://frontier:8080
      PHOTON_ENABLE_PPROF: ${PHOTON_ENABLE_PPROF:-0}
      PHOTON_PPROF_PORT: "6061"
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 2G

  fetcher:
    build:
      context: ./fetcher
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      init-minio:
        condition: service_completed_successfully
      frontier:
        condition: service_started
      renderer:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: ${FETCHER_KAFKA_TOPIC:-urls}
      KAFKA_PRODUCER_TOPIC: ${FETCHER_KAFKA_PRODUCER_TOPIC:-fetched-pages}
      KAFKA_DYNAMIC_URLS_TOPIC: ${FETCHER_KAFKA_DYNAMIC_URLS_TOPIC:-discovered-urls}
      KAFKA_GROUP: ${FETCHER_KAFKA_GROUP:-fetcher-group}
      RENDERER_URL: http://renderer:3000
      FRONTIER_URL: http://frontier:8080
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      KAFKA_DLQ_TOPIC: ${FETCHER_KAFKA_DLQ_TOPIC:-fetcher-dlq}
      PROMETHEUS_PORT: ${FETCHER_PROMETHEUS_PORT:-2112}
      MAX_ROUTINES: ${PHOTON_MAX_ROUTINES:-10}
      PHOTON_ENABLE_PPROF: ${PHOTON_ENABLE_PPROF:-0}
      PHOTON_PPROF_PORT: "6060"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Deliberately isolated behind the test profile. It provides stable static,
  # dynamic, redirect, robots, and timestamp-recording endpoints for the
  # acceptance suite without ever crawling the public web.
  origin:
    build:
      context: ./tests/origin
    profiles: ["test"]
    environment:
      PHOTON_ORIGIN_CRAWL_DELAY: ${PHOTON_ORIGIN_CRAWL_DELAY:-1}
    ports:
      - "18088:8088"
    networks:
      default:
        aliases:
          - origin-0
          - origin-1
          - origin-2
          - origin-3
          - origin-4
          - origin-5
          - origin-6
          - origin-7
          - origin-8
          - origin-9
          - origin-10
          - origin-11
          - origin-12
          - origin-13
          - origin-14
          - origin-15
          - origin-16
          - origin-17

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus-rules:/etc/prometheus/rules:ro

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./config/loki.yml:/etc/loki/config.yml:ro

  promtail:
    image: grafana/promtail:3.3.2
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    volumes:
      - ./config/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./config/tempo.yml:/etc/tempo/config.yml:ro
      - tempo_data:/tmp/tempo

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
  promtail_positions:
  tempo_data:
  search_model_cache:
